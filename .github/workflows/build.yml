name: Build APK

on:
  push:
    branches: [ master, main, singbox ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK / NDK / CMake
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/tools/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - name: Build sing-box libbox.aar
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH="$(go env GOPATH)/bin:$PATH"
          gomobile init
          git clone --depth 1 --branch v1.14.4 https://github.com/SagerNet/sing-box.git /tmp/sing-box
          cd /tmp/sing-box
          # Newer gomobile requires x/mobile to be part of the module graph.
          go get -tool golang.org/x/mobile/cmd/gobind
          CGO_LDFLAGS="-Wl,-z,max-page-size=16384" gomobile bind \
            -target=android/arm64 \
            -androidapi 23 \
            -tags "with_quic,with_wireguard,with_utls,with_gvisor" \
            -ldflags "-extldflags=-Wl,-z,max-page-size=16384" \
            -o "$GITHUB_WORKSPACE/TMessagesProj/libs/libbox.aar" \
            ./experimental/libbox
          ls -lh "$GITHUB_WORKSPACE/TMessagesProj/libs/libbox.aar"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK (arm64)
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleAfatRelease -PtgAbis=arm64-v8a --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          APK="$(find TMessagesProj_App/build/outputs -name '*.apk' | head -1)"
          test -n "$APK"
          cp "$APK" out/telegram-singbox-arm64.apk
          ls -lh out/telegram-singbox-arm64.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: telegram-singbox-arm64
          path: out/telegram-singbox-arm64.apk
          if-no-files-found: error
